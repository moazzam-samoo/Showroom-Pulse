name: tahir_showroom
description: Motorcycle Showroom ERP for Tahir Showroom
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  get: ^4.7.2
  
  # Icons
  lucide_icons: ^0.257.0
  
  # Path (for app data folder)
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  
  # Fonts
  google_fonts: ^6.1.0
  
  # Image Processing
  image: ^4.1.3
  
  # File Picker
  file_picker: ^8.0.0
  
  # Window Management (Desktop)
  window_manager: ^0.3.7
  
  # Charts
  fl_chart: ^0.66.0
  
  # Internationalization
  intl: ^0.18.1
  
  # Session Management (Keep me logged in)
  shared_preferences: ^2.2.2
  
  # Password Hashing
  crypto: ^3.0.3
  flutter_animate: ^4.5.2
  flutter_staggered_grid_view: ^0.7.0
  
  # PDF Generation
  pdf: ^3.11.1
  printing: ^5.13.3
  

  # Local Desktop Notifications
  local_notifier: ^0.1.6
  tray_manager: ^0.5.2
  smooth_page_indicator: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  
  assets:
    - assets/app_icon.ico
