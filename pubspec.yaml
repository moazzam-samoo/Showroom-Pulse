name: tahir_showroom
description: Motorcycle Showroom ERP for Tahir Showroom
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  get: ^4.6.6
  
  # Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  
  # File System & Paths
  path_provider: ^2.1.1
  path: ^1.8.3
  file_picker: ^6.1.1
  
  # Window Management (Windows Desktop)
  window_manager: ^0.3.7
  
  # Charts
  fl_chart: ^0.66.0
  
  # Date/Time & Formatting
  intl: ^0.18.1
  
  # Fonts
  google_fonts: ^6.1.0
  
  # Icons
  lucide_icons: ^0.257.0
  
  # Image handling
  image: ^4.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
  fonts:
    - family: Segoe UI
      fonts:
        - asset: assets/fonts/SegoeUI-Regular.ttf
        - asset: assets/fonts/SegoeUI-Bold.ttf
          weight: 700
        - asset: assets/fonts/SegoeUI-SemiBold.ttf
          weight: 600
